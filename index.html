<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG Servicios Eléctricos - Control de 15 Bombas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #334155; padding-bottom: 15px; }
    header h1 { font-size: 1.8rem; color: #38bdf8; }
    header p { color: #94a3b8; font-size: 0.95rem; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; }
    .status-badge { font-weight: bold; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; }
    .online { background-color: #166534; color: #4ade80; }
    .offline { background-color: #991b1b; color: #fca5a5; }

    .grid-bombas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
    .card { background: #1e293b; border-radius: 10px; padding: 15px; border: 1px solid #334155; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 1.1rem; font-weight: bold; color: #f1f5f9; display: flex; justify-content: space-between; margin-bottom: 10px; }
    .card-info { font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; line-height: 1.4; }
    
    .btn { border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; width: 100%; margin-top: 5px; }
    .btn-on { background-color: #22c55e; color: #052e16; }
    .btn-on:hover:not(:disabled) { background-color: #16a34a; }
    .btn-off { background-color: #ef4444; color: #450a0a; }
    .btn-off:hover:not(:disabled) { background-color: #dc2626; }
    
    .btn:disabled {
      background-color: #475569 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .estado-tag { font-size: 0.8rem; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
    .st-ENCENDIDA { background: #15803d; color: #dcfce7; }
    .st-APAGADA { background: #334155; color: #cbd5e1; }
    .st-FALLA { background: #b91c1c; color: #fef2f2; }
    .st-SIN_RESPUESTA { background: #c2410c; color: #ffedd5; }
  </style>
</head>
<body>

  <header>
    <h1>AG Servicios Eléctricos</h1>
    <p>Sistema de Monitoreo y Control LoRa/Firebase (15 Bombas)</p>
  </header>

  <div class="status-bar">
    <span>Estado del Maestro ESP32:</span>
    <span id="maestroStatus" class="status-badge offline">DESCONECTADO</span>
  </div>

  <div class="grid-bombas" id="contenedorBombas"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://control-de-bombas-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const contenedor = document.getElementById('contenedorBombas');
    const maestroStatus = document.getElementById('maestroStatus');

    let ultimoHeartbeatTiempo = 0;
    let maestroOnline = false;
    let datosBombasActuales = {};

    // 1. Escuchar el latido del Maestro
    onValue(ref(db, 'sistema/lastSeen'), (snapshot) => {
      if (snapshot.exists()) {
        ultimoHeartbeatTiempo = Date.now();
      }
    });

    // 2. Comprobar constantemente si el Maestro sigue vivo (cada 3 segundos)
    setInterval(() => {
      const ahora = Date.now();
      // Si pasaron más de 25 segundos sin actualización de Firebase -> DESCONECTADO
      const estabaOnline = maestroOnline;
      maestroOnline = (ahora - ultimoHeartbeatTiempo) < 25000 && ultimoHeartbeatTiempo > 0;

      if (maestroOnline) {
        maestroStatus.textContent = "EN LÍNEA";
        maestroStatus.className = "status-badge online";
      } else {
        maestroStatus.textContent = "DESCONECTADO";
        maestroStatus.className = "status-badge offline";
      }

      // Si cambió el estado del maestro, refrescar la pantalla para bloquear/desbloquear
      if (estabaOnline !== maestroOnline) {
        renderizarGrid();
      }
    }, 3000);

    // 3. Escuchar los estados de las bombas
    onValue(ref(db, 'bombas'), (snapshot) => {
      datosBombasActuales = snapshot.val() || {};
      renderizarGrid();
    });

    function renderizarGrid() {
      contenedor.innerHTML = '';

      for (let i = 1; i <= 15; i++) {
        const key = `bomba_${i}`;
        const b = datosBombasActuales[key] || { comando: 'APAGAR', estado: 'APAGADA', rssi: 0 };
        
        let claseEstado = 'st-APAGADA';
        const sinRespuesta = (b.estado === 'SIN_RESPUESTA');

        if (b.estado === 'ENCENDIDA') claseEstado = 'st-ENCENDIDA';
        else if (b.estado && b.estado.includes('FALLA')) claseEstado = 'st-FALLA';
        else if (sinRespuesta) claseEstado = 'st-SIN_RESPUESTA';

        // Se bloquea el botón si el maestro está deshabilitado o si la bomba individual no responde
        const deshabilitado = !maestroOnline || sinRespuesta;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-title">
              <span>Bomba ${i}</span>
              <span class="estado-tag ${claseEstado}">${b.estado || 'DESCONOCIDO'}</span>
            </div>
            <div class="card-info">
              Comando actual: <strong>${b.comando || 'NINGUNO'}</strong><br>
              Señal RSSI: <strong>${b.rssi ? b.rssi + ' dBm' : 'N/D'}</strong>
            </div>
          </div>
          <div>
            ${b.comando === 'PRENDER' 
              ? `<button class="btn btn-off" ${deshabilitado ? 'disabled' : ''} onclick="cambiarComando(${i}, 'APAGAR')">APAGAR</button>`
              : `<button class="btn btn-on" ${deshabilitado ? 'disabled' : ''} onclick="cambiarComando(${i}, 'PRENDER')">ENCENDER</button>`
            }
          </div>
        `;
        contenedor.appendChild(card);
      }
    }

    window.cambiarComando = function(id, nuevoComando) {
      if (!maestroOnline) return;
      
      const updates = {};
      updates[`bombas/bomba_${id}/comando`] = nuevoComando;
      update(ref(db), updates);
    };
  </script>
</body>
</html>
