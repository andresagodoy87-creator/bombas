<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG Servicios Eléctricos - Control de 15 Bombas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #334155; padding-bottom: 15px; }
    header h1 { font-size: 1.8rem; color: #38bdf8; }
    header p { color: #94a3b8; font-size: 0.95rem; }
    
    /* Barra de estado del sistema */
    .status-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
    .status-badge { font-weight: bold; padding: 5px 12px; border-radius: 4px; font-size: 0.85rem; text-transform: uppercase; }
    .online { background-color: #166534; color: #4ade80; }
    .offline { background-color: #991b1b; color: #fca5a5; }

    /* Alerta global cuando se bloquea el panel */
    .banner-alerta {
      display: none;
      background-color: #7f1d1d;
      color: #fecaca;
      border: 1px solid #dc2626;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .grid-bombas { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 15px; }
    .card { background: #1e293b; border-radius: 10px; padding: 15px; border: 1px solid #334155; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
    .card.sin-comunicacion { border-color: #f97316; background: #1c1917; }
    
    .card-title { font-size: 1.1rem; font-weight: bold; color: #f1f5f9; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-info { font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; line-height: 1.5; }
    
    .btn { border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; width: 100%; margin-top: 5px; }
    .btn-on { background-color: #22c55e; color: #052e16; }
    .btn-on:hover:not(:disabled) { background-color: #16a34a; }
    .btn-off { background-color: #ef4444; color: #450a0a; }
    .btn-off:hover:not(:disabled) { background-color: #dc2626; }
    
    /* Estado deshabilitado / bloqueado */
    .btn:disabled {
      background-color: #475569 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .estado-tag { font-size: 0.75rem; font-weight: bold; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
    .st-ENCENDIDA { background: #15803d; color: #dcfce7; }
    .st-APAGADA { background: #334155; color: #cbd5e1; }
    .st-FALLA { background: #b91c1c; color: #fef2f2; }
    .st-SIN_RESPUESTA { background: #c2410c; color: #ffedd5; }
  </style>
</head>
<body>

  <header>
    <h1>AG Servicios Eléctricos</h1>
    <p>Sistema de Monitoreo y Control LoRa/Firebase (15 Bombas)</p>
  </header>

  <!-- Estado Maestro -->
  <div class="status-bar">
    <span>Estado Conexión Maestro ESP32:</span>
    <span id="maestroStatus" class="status-badge offline">DESCONECTADO</span>
  </div>

  <!-- Cartel de advertencia global -->
  <div id="bannerAlerta" class="banner-alerta">
    ⚠️ MAESTRO SIN CONEXIÓN A INTERNET: Se ha deshabilitado el control para evitar inconsistencias.
  </div>

  <!-- Contenedor de Bombas -->
  <div class="grid-bombas" id="contenedorBombas"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://control-de-bombas-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const contenedor = document.getElementById('contenedorBombas');
    const maestroStatus = document.getElementById('maestroStatus');
    const bannerAlerta = document.getElementById('bannerAlerta');

    let maestroOnline = false;

    // Monitor de estado del Maestro
    onValue(ref(db, 'sistema/maestroOnline'), (snapshot) => {
      maestroOnline = snapshot.val() === true;
      
      if (maestroOnline) {
        maestroStatus.textContent = "EN LÍNEA (ONLINE)";
        maestroStatus.className = "status-badge online";
        bannerAlerta.style.display = "none";
      } else {
        maestroStatus.textContent = "SIN CONEXIÓN (OFFLINE)";
        maestroStatus.className = "status-badge offline";
        bannerAlerta.style.display = "block";
      }
      
      // Forzar renderizado para actualizar el estado de los botones (bloquear/desbloquear)
      if (window.ultimoSnapshotBombas) {
        renderizarBombas(window.ultimoSnapshotBombas);
      }
    });

    // Monitor de los nodos de las bombas
    onValue(ref(db, 'bombas'), (snapshot) => {
      window.ultimoSnapshotBombas = snapshot.val() || {};
      renderizarBombas(window.ultimoSnapshotBombas);
    });

    function renderizarBombas(data) {
      contenedor.innerHTML = '';

      for (let i = 1; i <= 15; i++) {
        const key = `bomba_${i}`;
        const b = data[key] || { comando: 'APAGAR', estado: 'APAGADA', rssi: 0 };
        
        const esSinRespuesta = (b.estado === 'SIN_RESPUESTA');
        let claseEstado = 'st-APAGADA';
        
        if (b.estado === 'ENCENDIDA') claseEstado = 'st-ENCENDIDA';
        else if (b.estado && b.estado.includes('FALLA')) claseEstado = 'st-FALLA';
        else if (esSinRespuesta) claseEstado = 'st-SIN_RESPUESTA';

        // Evaluar si esta bomba en específico se puede operar
        const botonBloqueado = !maestroOnline || esSinRespuesta;

        const card = document.createElement('div');
        card.className = `card ${esSinRespuesta ? 'sin-comunicacion' : ''}`;
        
        card.innerHTML = `
          <div>
            <div class="card-title">
              <span>Bomba ${i}</span>
              <span class="estado-tag ${claseEstado}">${b.estado || 'DESCONOCIDO'}</span>
            </div>
            <div class="card-info">
              Comando actual: <strong>${b.comando || 'NINGUNO'}</strong><br>
              Señal RSSI LoRa: <strong>${b.rssi ? b.rssi + ' dBm' : 'N/D'}</strong><br>
              ${esSinRespuesta ? '<span style="color:#f97316; font-weight:bold;">⚠️ Sin comunicación LoRa</span>' : ''}
            </div>
          </div>
          <div>
            ${b.comando === 'PRENDER' 
              ? `<button class="btn btn-off" ${botonBloqueado ? 'disabled' : ''} onclick="cambiarComando(${i}, 'APAGAR')">
                  ${botonBloqueado ? 'BLOQUEADO' : 'APAGAR'}
                 </button>`
              : `<button class="btn btn-on" ${botonBloqueado ? 'disabled' : ''} onclick="cambiarComando(${i}, 'PRENDER')">
                  ${botonBloqueado ? 'BLOQUEADO' : 'ENCENDER'}
                 </button>`
            }
          </div>
        `;
        contenedor.appendChild(card);
      }
    }

    // Función enviadora a Firebase (protegida)
    window.cambiarComando = function(id, nuevoComando) {
      if (!maestroOnline) {
        alert("Acción denegada: El Maestro ESP32 está fuera de línea.");
        return;
      }
      
      const updates = {};
      updates[`bombas/bomba_${id}/comando`] = nuevoComando;
      update(ref(db), updates);
    };
  </script>
</body>
</html>
