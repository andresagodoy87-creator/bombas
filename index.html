<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Bombas - AG Servicios Eléctricos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #121824; color: #ffffff; padding: 16px; }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #232d3f;
    }
    .header-logo {
      height: 55px;
      width: auto;
      border-radius: 50%;
    }
    header h1 { 
      font-size: 1.8rem; 
      color: #38bdf8; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Barra de estado */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a2232;
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid #2b364a;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .status-badge {
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    .online { background: #166534; color: #4ade80; }
    .offline { background: #991b1b; color: #fca5a5; }

    /* Grilla de Bombas */
    .grid-bombas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    /* Tarjetas */
    .card {
      background: #1c2333;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #2b364a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
    }
    .rssi-text {
      font-size: 0.85rem;
      color: #8b99b0;
    }

    /* Caja Central de Estado con Icono */
    .status-box {
      background: #334155;
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 80px;
      transition: background 0.3s;
    }

    .status-box.activa { background: #065f46; }
    .status-box.falla { background: #991b1b; }
    .status-box.sin-respuesta { background: #9a3412; }

    .bomba-icon {
      width: 28px;
      height: 28px;
      fill: currentColor;
      color: #ffffff;
    }

    .status-text {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.2;
    }

    /* Botones Lado a Lado */
    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      border: none;
      padding: 10px 4px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .btn-on { background-color: #22c55e; color: #ffffff; }
    .btn-off { background-color: #ef4444; color: #ffffff; }

    .btn:disabled {
      background-color: #475569 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <header>
    <!-- Muestra la imagen del Logo de la Cooperativa -->
    <img src="logo.png" alt="Logo Cooperativa" class="header-logo" onerror="this.style.display='none'">
    <h1>CONTROL DE BOMBAS</h1>
  </header>

  <div class="status-bar">
    <span>MÓDULO MAESTRO:</span>
    <span id="maestroStatus" class="status-badge offline">DESCONECTADO</span>
  </div>

  <div class="grid-bombas" id="contenedorBombas"></div>

    let estaOnline = false;
    let datosBombas = {};

    onValue(ref(db), (snapshot) => {
      ultimoCambio = Date.now();
