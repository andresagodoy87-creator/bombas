<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG Servicios Eléctricos - Control de Bombas</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121826; color: #ffffff; padding: 20px; }
    header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #2a3447; position: relative; }
    header h1 { color: #00d2ff; font-size: 1.8rem; letter-spacing: 1px; }
    header p { color: #8f9cae; font-size: 0.95rem; margin-top: 5px; }

    /* Indicador del Estado del Maestro */
    .status-maestro {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      background-color: #1a2332;
      border: 1px solid #2a3447;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-online { background-color: #28a745; box-shadow: 0 0 8px #28a745; }
    .dot-offline { background-color: #dc3545; box-shadow: 0 0 8px #dc3545; }

    /* Grilla optimizada */
    .grid-container { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
      gap: 15px; 
      max-width: 1200px; 
      margin: 0 auto; 
      width: 100%;
    }

    /* Regla para celulares (iPhone/Android) */
    @media (max-width: 600px) {
      body { padding: 10px; }
      header h1 { font-size: 1.4rem; }
      header p { font-size: 0.85rem; }
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .card { padding: 12px !important; }
      .card h3 { font-size: 1rem !important; }
      .banner-estado { font-size: 0.78rem !important; padding: 8px !important; }
      button { padding: 10px 5px !important; font-size: 0.8rem !important; }
    }

    .card { background-color: #1a2332; border-radius: 12px; padding: 20px; border: 2px solid #2a3447; transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; }
    .card h3 { font-size: 1.2rem; margin-bottom: 10px; color: #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .card .rssi { font-size: 0.75rem; color: #8f9cae; font-weight: normal; }

    .banner-estado { padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 0.88rem; margin: 15px 0; transition: background-color 0.3s ease; }
    .btn-group { display: flex; gap: 8px; margin-top: 5px; }

    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: opacity 0.2s ease, transform 0.1s ease; }
    button:active { transform: scale(0.98); }
    .btn-prender { background-color: #28a745; color: #ffffff; }
    .btn-apagar { background-color: #dc3545; color: #ffffff; }
    button:hover { opacity: 0.85; }

    .estado-encendida { border-color: #28a745 !important; box-shadow: 0 0 10px rgba(40, 167, 69, 0.2); }
    .estado-apagada { border-color: #2a3447 !important; }
    .estado-falla { border-color: #dc3545 !important; box-shadow: 0 0 12px rgba(220, 53, 69, 0.4); }
    .estado-offline { border-color: #ffc107 !important; }

    @keyframes parpadeoAlarma { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .animar-falla { animation: parpadeoAlarma 1.2s infinite; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://control-de-bombas-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Renderizar tarjetas de bombas
    const grid = document.getElementById("grid-bombas");
    for (let i = 1; i <= 15; i++) {
      grid.innerHTML += `
        <div class="card estado-apagada" id="tarjeta-${i}">
          <h3>
            Bomba ${i}
            <span class="rssi" id="rssi-${i}">-- dBm</span>
          </h3>
          <div class="banner-estado" id="banner-${i}" style="background-color: #6c757d; color: #fff;">
            ❄️ BOMBA DETENIDA
          </div>
          <div class="btn-group">
            <button class="btn-prender" id="btn-prender-${i}">PRENDER</button>
            <button class="btn-apagar" id="btn-apagar-${i}">APAGAR</button>
          </div>
        </div>
      `;
    }

    // Eventos de botones para enviar comandos
    for (let i = 1; i <= 15; i++) {
      document.getElementById(`btn-prender-${i}`).addEventListener('click', () => enviarComando(i, 'PRENDER'));
      document.getElementById(`btn-apagar-${i}`).addEventListener('click', () => enviarComando(i, 'APAGAR'));
    }

    function enviarComando(idBomba, orden) {
      console.log(`Enviando ${orden} a Bomba ${idBomba}...`);
      set(ref(database, `bombas/bomba_${idBomba}/comando`), orden)
        .then(() => console.log(`✅ Orden ${orden} guardada en Firebase.`))
        .catch((err) => alert("Error en Firebase: " + err.message));
    }

    // 1. ESCUCHAR ESTADO DE LAS BOMBAS
    const bombasRef = ref(database, 'bombas');
    onValue(bombasRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      for (let i = 1; i <= 15; i++) {
        const bomba = data[`bomba_${i}`];
        if (bomba) {
          actualizarInterfazTarjeta(i, bomba.estado, bomba.rssi);
        }
      }
    });

    // 2. ESCUCHAR ESTADO DEL MAESTRO
    const sistemaRef = ref(database, 'sistema');
    let temporizadorVerificacion = null;

    onValue(sistemaRef, (snapshot) => {
      const datos = snapshot.val();
      const dot = document.getElementById("dot-maestro");
      const texto = document.getElementById("texto-maestro");

      if (temporizadorVerificacion) clearInterval(temporizadorVerificacion);

      const evaluarConexion = () => {
        // Si no hay datos, o maestroOnline no es true, o no hay timestamp
        if (!datos || datos.maestroOnline !== true || !datos.ultimaConexion) {
          dot.className = "status-dot dot-offline";
          texto.innerText = "Maestro Offline";
          return;
        }

        const tiempoActual = Date.now();
        const ultimaLectura = Number(datos.ultimaConexion);
        const diferenciaSegundos = (tiempoActual - ultimaLectura) / 1000;

        // Requiere un latido recibido hace menos de 25 segundos
        if (diferenciaSegundos >= 0 && diferenciaSegundos < 25) {
          dot.className = "status-dot dot-online";
          texto.innerText = "Maestro Online";
        } else {
          dot.className = "status-dot dot-offline";
          texto.innerText = "Maestro Offline";
        }
      };

      evaluarConexion();
      temporizadorVerificacion = setInterval(evaluarConexion, 3000);
    });

    function actualizarInterfazTarjeta(id, estado, rssi) {
      const tarjeta = document.getElementById(`tarjeta-${id}`);
      const banner = document.getElementById(`banner-${id}`);
      const rssiLabel = document.getElementById(`rssi-${id}`);

      if (rssi) rssiLabel.innerText = `${rssi} dBm`;

      tarjeta.classList.remove("estado-encendida", "estado-apagada", "estado-falla", "estado-offline");
      banner.classList.remove("animar-falla");

      switch (estado) {
        case "ENCENDIDA":
          tarjeta.classList.add("estado-encendida");
          banner.innerHTML = "⚡ <b>BOMBA EN MARCHA</b>";
          banner.style.backgroundColor = "#28a745";
          banner.style.color = "#ffffff";
          break;

        case "FALLA_GUARDAMOTOR":
          tarjeta.classList.add("estado-falla");
          banner.classList.add("animar-falla");
          banner.innerHTML = "🚨 <b>FALLA: GUARDAMOTOR</b>";
          banner.style.backgroundColor = "#dc3545";
          banner.style.color = "#ffffff";
          break;

        case "FALLA_CONTACTOR_TRABADO":
          tarjeta.classList.add("estado-falla");
          banner.classList.add("animar-falla");
          banner.innerHTML = "🚨 <b>CONTACTOR TRABADO</b>";
          banner.style.backgroundColor = "#dc3545";
          banner.style.color = "#ffffff";
          break;

        case "SIN_COMUNICACION":
          tarjeta.classList.add("estado-offline");
          banner.innerHTML = "⚠️ <b>SIN COMUNICACIÓN</b>";
          banner.style.backgroundColor = "#ffc107";
          banner.style.color = "#000000";
          break;

        case "APAGADA":
        default:
          tarjeta.classList.add("estado-apagada");
          banner.innerHTML = "❄️ <b>BOMBA DETENIDA</b>";
          banner.style.backgroundColor = "#6c757d";
          banner.style.color = "#ffffff";
          break;
      }
    }
  </script>
</head>
<body>

  <header>
    <h1>AG SERVICIOS ELÉCTRICOS</h1>
    <p>Sistema de Automatización y Monitoreo de Pozos vía LoRa</p>
    
    <!-- INDICADOR DE CONEXIÓN DEL MAESTRO -->
    <div class="status-maestro">
      <span class="status-dot dot-offline" id="dot-maestro"></span>
      <span id="texto-maestro">Maestro Offline</span>
    </div>
  </header>

  <main class="grid-container" id="grid-bombas">
  </main>

</body>
</html>
