<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG Servicios Eléctricos - Control de 15 Bombas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { background-color: #0b132b; color: #ffffff; padding: 15px; }
    
    header { 
      text-align: center; 
      padding: 15px; 
      background: #1c2541; 
      border-radius: 10px; 
      margin-bottom: 15px;
      border: 1px solid #3a506b;
    }
    header h1 { font-size: 1.6rem; color: #6fffe9; margin-bottom: 5px; }
    header p { color: #a3cef1; font-size: 0.9rem; }

    /* Barra del estado */
    .status-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #1c2541; 
      padding: 12px 20px; 
      border-radius: 8px; 
      margin-bottom: 15px;
      border: 1px solid #3a506b;
    }
    .status-badge { 
      font-weight: bold; 
      padding: 6px 12px; 
      border-radius: 5px; 
      font-size: 0.85rem; 
      text-transform: uppercase;
    }
    .online { background: #10b981; color: #042f2e; }
    .offline { background: #ef4444; color: #450a0a; }

    /* Grilla de Bombas */
    .grid-bombas { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
      gap: 15px; 
    }

    /* Tarjeta individual */
    .card { 
      background: #1c2541; 
      border-radius: 10px; 
      padding: 15px; 
      border: 2px solid #3a506b; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
    }
    .card.encendida { border-color: #10b981; background: #0b2528; }
    .card.falla { border-color: #ef4444; background: #2b1117; }
    .card.sin-respuesta { border-color: #f97316; background: #29180e; }

    .card-title { 
      font-size: 1.1rem; 
      font-weight: bold; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      margin-bottom: 10px;
    }

    .card-info { 
      font-size: 0.85rem; 
      color: #cbd5e1; 
      margin-bottom: 12px; 
      line-height: 1.5;
      background: #0b132b;
      padding: 8px;
      border-radius: 6px;
    }

    /* Botones */
    .btn { 
      border: none; 
      padding: 12px; 
      border-radius: 6px; 
      font-weight: bold; 
      cursor: pointer; 
      width: 100%; 
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    .btn-on { background: #10b981; color: #ffffff; }
    .btn-off { background: #ef4444; color: #ffffff; }
    .btn:disabled { background: #475569 !important; color: #94a3b8 !important; cursor: not-allowed; opacity: 0.6; }

    /* Etiquetas */
    .tag { font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    .tag-ENCENDIDA { background: #047857; color: #ecfdf5; }
    .tag-APAGADA { background: #334155; color: #f8fafc; }
    .tag-FALLA { background: #b91c1c; color: #fef2f2; }
    .tag-SIN_RESPUESTA { background: #c2410c; color: #fff7ed; }
  </style>
</head>
<body>

  <header>
    <h1>AG SERVICIOS ELÉCTRICOS</h1>
    <p>Control Centralizado de Bombas (LoRa / Firebase)</p>
  </header>

  <div class="status-bar">
    <span>ESTADO DEL MAESTRO ESP32:</span>
    <span id="maestroStatus" class="status-badge offline">DESCONECTADO</span>
  </div>

  <div class="grid-bombas" id="contenedorBombas"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://control-de-bombas-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const contenedor = document.getElementById('contenedorBombas');
    const maestroStatus = document.getElementById('maestroStatus');

    let ultimoCambio = Date.now();
    let estaOnline = false;
    let datosBombas = {};

    // Detectar cuando Firebase recibe CUALQUIER dato de las bombas o sistema
    onValue(ref(db), (snapshot) => {
      ultimoCambio = Date.now();
      if (snapshot.exists()) {
        const root = snapshot.val();
        datosBombas = root.bombas || {};
      }
      revisarConexion();
      render();
    });

    // Monitoreo constante del tiempo
    setInterval(() => {
      revisarConexion();
    }, 1000);

    function revisarConexion() {
      const tiempoSinDatos = Date.now() - ultimoCambio;
      const estadoPrevio = estaOnline;

      // Si pasaron menos de 25 segundos desde la última actualización recibida, considera que el maestro está vivo
      estaOnline = (tiempoSinDatos < 25000);

      if (estaOnline) {
        maestroStatus.textContent = "EN LÍNEA";
        maestroStatus.className = "status-badge online";
      } else {
        maestroStatus.textContent = "DESCONECTADO";
        maestroStatus.className = "status-badge offline";
      }

      if (estadoPrevio !== estaOnline) {
        render();
      }
    }

    function render() {
      contenedor.innerHTML = '';

      for (let i = 1; i <= 15; i++) {
        const key = `bomba_${i}`;
        const b = datosBombas[key] || { comando: 'APAGAR', estado: 'APAGADA', rssi: 0 };
        
        let claseCard = '';
        let claseTag = 'tag-APAGADA';
        const sinRespuesta = (b.estado === 'SIN_RESPUESTA');

        if (b.estado === 'ENCENDIDA') {
          claseCard = 'encendida';
          claseTag = 'tag-ENCENDIDA';
        } else if (b.estado && b.estado.includes('FALLA')) {
          claseCard = 'falla';
          claseTag = 'tag-FALLA';
        } else if (sinRespuesta) {
          claseCard = 'sin-respuesta';
          claseTag = 'tag-SIN_RESPUESTA';
        }

        const bloq = !estaOnline || sinRespuesta;

        const card = document.createElement('div');
        card.className = `card ${claseCard}`;
        card.innerHTML = `
          <div>
            <div class="card-title">
              <span>BOMBA ${i}</span>
              <span class="tag ${claseTag}">${b.estado || 'DESCONOCIDO'}</span>
            </div>
            <div class="card-info">
              Comando: <strong>${b.comando || 'NINGUNO'}</strong><br>
              Señal RSSI: <strong>${b.rssi ? b.rssi + ' dBm' : 'N/D'}</strong>
            </div>
          </div>
          <div>
            ${b.comando === 'PRENDER' 
              ? `<button class="btn btn-off" ${bloq ? 'disabled' : ''} onclick="enviar(${i}, 'APAGAR')">APAGAR</button>`
              : `<button class="btn btn-on" ${bloq ? 'disabled' : ''} onclick="enviar(${i}, 'PRENDER')">ENCENDER</button>`
            }
          </div>
        `;
        contenedor.appendChild(card);
      }
    }

    window.enviar = function(id, comando) {
      if (!estaOnline) return;
      const updates = {};
      updates[`bombas/bomba_${id}/comando`] = comando;
      update(ref(db), updates);
    };
  </script>
</body>
</html>
